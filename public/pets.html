<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous"
    />
    <title>Pet Guardian</title>

    <link href="css/style.css" rel="stylesheet" />
    <link href="css/color.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid px-5">
        <a class="navbar-brand d-flex align-items-center ms-5" href="index.html">
            <img src="images/logo.png"
            class="logo img-fluid" alt = "Pet Guardian Logo"/>
          <span class="ms-2 fw-bold">Pet Guardian - Pet</span>
      </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- me-auto: margin-right: auto -->
          <ul class="navbar-nav me-auto">
            <li class="nav-item mx-5">
              <a class="nav-link fs-3" href="index.html">Home</a>
            </li>
            <li class="nav-item mx-5">
              <a class="nav-link fs-3" href="challenges.html">Challenges</a>
            </li>
            <li class="nav-item mx-5">
              <a class="nav-link active fw-bold fs-3" href="pets.html">Pets</a>
            </li>
            <li class="nav-item mx-5">
              <a class="nav-link fs-3" href="food.html">Store</a>
            </li>
          </ul>
          <!-- ms-auto: margin-left: auto -->
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item mx-5">
              <a id="profileButton" href="profile.html" class="nav-link fs-3 py-2">Profile</a>
            </li>
            <li class="nav-item mx-5">
              <a id="logoutButton" href="#" class="nav-link fs-3 py-2">Logout</a>
            </li>
            <li class="nav-item mx-5">
              <a id="loginButton" href="login.html" class="nav-link fs-3 py-2">Login</a>
            </li>
            <li>
              <div class="btn-nav mx-4">
                <a id="registerButton" class="btn text-bg-dark btn-lg navbar-btn" href="/register.html"
                  >Register!</a
                >
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>


    <main class="py-4">
      <div class="container">
        <!-- Header Section -->
        <section class="mb-5 mt-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="fw-bold mb-2 display-5">Pets</h1>
              <p class="text-muted">Adopt a Pet to accompany your wellness journey!</p>
            </div>

            <!-- Points Tracker (small) -->
            <!-- <div id="pointsTracker" class="d-none">
              <div class="card">
                <div class="card-body py-2">
                  <div class="d-flex align-items-center">
                    <span class="me-2">💰</span>
                    <span>Points:</span>
                    <span class="ms-2 fw-bold" id="userPoints">0</span>
                  </div>
                </div>
              </div>
            </div> -->

            <div id="pointsTracker" class="d-none">
            <div class="badge bg-primary fs-5 px-4 py-3 rounded-pill shadow-sm">
                💰 Points: <span class="fw-bold" id="userPoints">0</span>
            </div>
            </div>
          </div>


          <!-- Login Hint -->
          <div id="loginHint" class="alert alert-warning d-none">
            Please login to adopt a pet.
          </div>

          <!-- Messages -->
          <div id="errorMsg" class="alert alert-danger d-none"></div>
          <div id="successMsg" class="alert alert-success d-none"></div>
        </section>

        <!-- Pets Grid -->
        <section class="mb-5 mt-5">
          <h2 class="mb-4 display-5 fw-bold text-center">Choose Your Pet</h2>
          <div class="row g-4" id="petsContainer">
            <!-- Pets will be loaded here -->
          </div>
        </section>
      </div>
    </main>

    <!-- Adopt Modal -->
    <div class="modal fade" id="adoptModal">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Adopt a Pet</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="adoptError" class="alert alert-danger d-none mb-3"></div>
            <div class="text-center mb-4">
              <div id="modalPetEmoji" class="display-1 mb-3">🐕</div>
              <h4 id="modalPetSpecies" class="fw-bold"></h4>
              <p class="text-muted">Cost: <span id="modalPetCost">0</span> points</p>
            </div>
            <form id="adoptForm">
              <div class="mb-4">
                <label class="form-label fw-bold">Give Your Pet a Name</label>
                <input type="text" class="form-control" id="petNameInput" placeholder="e.g., Max, Luna, Charlie..." required>
              </div>
              <button type="submit" class="btn btn-success w-100 py-2">Adopt Pet</button>
            </form>
          </div>
        </div>
      </div>
    </div>


    <footer class="mt-auto py-3 bg-primary text-bg-primary text-center">
      <p class="m-0 py-0 px-4">
        &copy;Pet Guardian 2026 BED CA2. 
      </p>
    </footer>

    <!-- ADD JAVASCRIPTS BEFORE BODY ENDTAG -->
     <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"

      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
      integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
      crossorigin="anonymous"
    ></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>
    <script src="js/pets.js" type="text/javascript"></script>
  </body>
</html>
